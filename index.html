<script type="text/javascript">
  // Reinicia y reproduce el audio cada vez que se hace clic
  document.querySelectorAll('a.boton_s').forEach(function (boton) {
    boton.addEventListener('click', function (e) {
      e.preventDefault();

      const audio = this.firstChild;

      audio.pause();
      audio.currentTime = 0;
      audio.play();
    });
  });
</script>
